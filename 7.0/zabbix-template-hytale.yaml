              path: $.player_id
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var arr = JSON.parse(value);
                  
                  for (var i = 0; i < arr.length; i++) {
                    if (arr[i].basename) {
                      // NICHT basename überschreiben!
                      arr[i].player_id = arr[i].basename.replace(/\.json$/, '');
                    }
                  }
                  
                  return JSON.stringify(arr);
            - type: JSONPATH
              parameters:
                - '$[*]'
