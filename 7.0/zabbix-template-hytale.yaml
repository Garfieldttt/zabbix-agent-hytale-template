zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 503b3e79b0e445e5971085606695d852
      template: Hytale
      name: Hytale
      description: |
        Zabbix template for monitoring a Hytale server on Linux using Zabbix Agent (active checks).
        Discovers players, bans and whitelist entries by parsing local Hytale JSON files.
        
        Author: Thomas Rzen
        More information: https://github.com/Garfieldttt/zabbix-agent-hytale-template
      groups:
        - name: Templates
      items:
        - uuid: 09c14c7d41d4461c9cb197291627cb5c
          name: 'Sever max players'
          type: DEPENDENT
          key: server.maxplayers
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.MaxPlayers
          master_item:
            key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/config.json]'
          tags:
            - tag: Hytale
              value: Server
        - uuid: 5aceae7b46ee40a8ae1234af36915e27
          name: 'Sever max view radius'
          type: DEPENDENT
          key: server.maxviewradius
          delay: '0'
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.MaxViewRadius
          master_item:
            key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/config.json]'
          tags:
            - tag: Hytale
              value: Server
        - uuid: 9cfc5fed0801459f9b60bd83de7d0eab
          name: 'Sever MOTD'
          type: DEPENDENT
          key: server.motd
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.MOTD
          master_item:
            key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/config.json]'
          tags:
            - tag: Hytale
              value: Server
        - uuid: 75bc74fa6ac647078263699a62ac6e33
          name: 'Sever name'
          type: DEPENDENT
          key: server.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ServerName
          master_item:
            key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/config.json]'
          tags:
            - tag: Hytale
              value: Server
        - uuid: 60bc7b2aa9534b08b1988d099a3d9094
          name: player.raw
          type: ZABBIX_ACTIVE
          key: 'vfs.dir.get[{$PLAYER_JSON_PATH}Server/universe/players,^.+\.json$,,file,,0]'
          history: '0'
          value_type: TEXT
          trends: '0'
        - uuid: fe56dd2183084e6db8a66c8aad5b83c2
          name: bans.raw
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
          history: '0'
          value_type: TEXT
          trends: '0'
        - uuid: 99b3bdce707a4d0d82bb10275c6532ef
          name: server.raw
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/config.json]'
          value_type: TEXT
          trends: '0'
        - uuid: 70d90729b73840cda74b5611fda9d6d5
          name: whitelist.raw
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/whitelist.json]'
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  
                  var out = [];
                  if (Array.isArray(j.list)) {
                    for (var i = 0; i < j.list.length; i++) {
                      var u = j.list[i];
                      if (u) out.push({ "uuid": String(u) });
                    }
                  }
                  
                  // enabled bleibt erhalten
                  return JSON.stringify({
                    "enabled": !!j.enabled,
                    "data": out
                  });
      discovery_rules:
        - uuid: 7b10b5a114314b7094a7d576cf57b4c9
          name: 'Discover Bans'
          type: DEPENDENT
          key: discover.bans
          delay: '0'
          item_prototypes:
            - uuid: 1abf3bd80b8d42d4b51dd2d43b37713b
              name: 'Hytale player UUID:{#UUID} banned by'
              type: DEPENDENT
              key: 'player.by["{#UUID}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.target=="{#UUID}")].by.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: f882b76f52684501a7cec800776853c3
              name: 'Hytale player UUID:{#UUID} bann reason'
              type: DEPENDENT
              key: 'player.reason["{#UUID}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.target=="{#UUID}")].reason.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: a8fa55a908f24c04a29fd6cf2de05f99
              name: 'Hytale player UUID:{#UUID} banned'
              type: DEPENDENT
              key: 'player.target["{#UUID}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.target=="{#UUID}")].target.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'not banned'
              master_item:
                key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
              trigger_prototypes:
                - uuid: ad925b33b2974ab8a47ed019cfa9f411
                  expression: 'last(/Hytale/player.target["{#UUID}"])={#UUID}'
                  name: 'Hytale Player UUID: {#UUID} banned'
                  priority: AVERAGE
            - uuid: 085296f4ff814c539b1f2d0ac2ab86c2
              name: 'Hytale player UUID:{#UUID} bann time'
              type: DEPENDENT
              key: 'player.timestamp["{#UUID}"]'
              delay: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.target=="{#UUID}")].timestamp.first()'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - 'return Math.floor(value/1000)'
              master_item:
                key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: 72c8392d19b341beb3f9fe006230c797
              name: 'Hytale player UUID:{#UUID} bann type'
              type: DEPENDENT
              key: 'player.type["{#UUID}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.target=="{#UUID}")].type.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
          master_item:
            key: 'vfs.file.contents[{$PLAYER_JSON_PATH}Server/bans.json]'
          lld_macro_paths:
            - lld_macro: '{#UUID}'
              path: $.target
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[*]'
        - uuid: a5a301ad57b84f0fa9b427a896900c39
          name: 'Discover Player'
          type: DEPENDENT
          key: discover.player
          delay: '0'
          item_prototypes:
            - uuid: 91eec0698bf743619779901a30276812
              name: 'Hytale player UUID:{#UUID} ammo state'
              type: DEPENDENT
              key: 'player.ammo["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.Ammo.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: 641289d25bb0419381acdab9cd065a72
              name: 'Hytale player UUID:{#UUID} death marker'
              type: DEPENDENT
              key: 'player.deathmarker["{#PATHNAME}"]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Player.PlayerData.PerWorldData
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var pwd, world, w, out, i, dp, t, id;
                      
                      try {
                        pwd = JSON.parse(value); // value ist PerWorldData-Objekt
                      } catch (e) {
                        return null;
                      }
                      
                      if (!pwd) return "";
                      
                      out = [];
                      
                      for (world in pwd) {
                        if (!pwd.hasOwnProperty(world)) continue;
                      
                        w = pwd[world];
                      
                        if (w.DeathPositions && w.DeathPositions.length) {
                          out.push("World: " + world);
                      
                          for (i = 0; i < w.DeathPositions.length; i++) {
                            dp = w.DeathPositions[i];
                      
                            id = dp.MarkerId ? dp.MarkerId : ("Death #" + (i + 1));
                            out.push(id);
                      
                            t = dp.Transform;
                            if (t) {
                              out.push("  X: " + t.X);
                              out.push("  Y: " + t.Y);
                              out.push("  Z: " + t.Z);
                            } else {
                              out.push("  (no Transform)");
                            }
                      
                            // optional: Day anzeigen
                            if (typeof dp.Day !== "undefined") {
                              out.push("  Day: " + dp.Day);
                            }
                      
                            out.push("");
                          }
                      
                          out.push("");
                        }
                      }
                      
                      return out.join("\n");
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: aebed53ee99a42b89a4bfd1617c33682
              name: 'Hytale player UUID:{#UUID} discovered zones'
              type: DEPENDENT
              key: 'player.discoveredzones["{#PATHNAME}"]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Player.PlayerData.DiscoveredZones
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: STR_REPLACE
                  parameters:
                    - '","'
                    - ', '
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: d7e62bae56ec4392bc01a97621ebe524
              name: 'Hytale player UUID:{#UUID} gamemode'
              type: DEPENDENT
              key: 'player.gamemode["{#PATHNAME}"]'
              delay: '0'
              trends: '0'
              valuemap:
                name: GameMode
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Player.GameMode
                - type: STR_REPLACE
                  parameters:
                    - Adventure
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - Exploration
                    - '2'
                - type: STR_REPLACE
                  parameters:
                    - Creative
                    - '3'
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
              trigger_prototypes:
                - uuid: 2e4be7954dbb47b38f718abee1a13ffd
                  expression: 'last(/Hytale/player.gamemode["{#PATHNAME}"])=3'
                  name: 'Player {#UUID} is in Creative mode'
                  priority: WARNING
            - uuid: dd21b2d5514f4981bde3a16444b4366a
              name: 'Hytale player UUID:{#UUID} gliding state'
              type: DEPENDENT
              key: 'player.gliding["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.GlidingActive.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: e45feb3870e34b428ea29599c6e1aac7
              name: 'Hytale player UUID:{#UUID} health state (incl. armor)'
              type: DEPENDENT
              key: 'player.healthy["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.Health.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: a04e6a38bc9f4b93bc88c301fef8792a
              name: 'Hytale player UUID:{#UUID} immunity state'
              type: DEPENDENT
              key: 'player.immunity["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.Immunity.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: d620289705354e9db1f8761ceca8c0eb
              name: 'Hytale player UUID:{#UUID} inventory list'
              type: DEPENDENT
              key: 'player.items["{#PATHNAME}"]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Player.Inventory
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // value = Inventory-Objekt als JSON-String (kommt aus dem vorherigen JSONPath-Step)
                      var inv = JSON.parse(value);
                      
                      function collect(sectionName, sectionObj, out) {
                        if (!sectionObj || !sectionObj.Items) return;
                      
                        var items = sectionObj.Items;
                        for (var slot in items) {
                          if (!items.hasOwnProperty(slot)) continue;
                      
                          var it = items[slot];
                          if (!it || !it.Id) continue;
                      
                          var qty = (it.Quantity !== undefined && it.Quantity !== null) ? it.Quantity : 0;
                          var dur = (it.Durability !== undefined && it.Durability !== null) ? it.Durability : 0;
                          var maxdur = (it.MaxDurability !== undefined && it.MaxDurability !== null) ? it.MaxDurability : 0;
                      
                          // Lesbares Format mit Labels
                          out.push(
                            sectionName + ":" + slot +
                            " Id=" + it.Id +
                            " Quantity=" + qty +
                            " Durability=" + dur + "/" + maxdur
                          );
                        }
                      }
                      
                      var out = [];
                      collect("Storage", inv.Storage, out);
                      collect("HotBar", inv.HotBar, out);
                      collect("Tool", inv.Tool, out);
                      collect("Armor", inv.Armor, out);
                      collect("Utility", inv.Utility, out);
                      
                      // stabile Ausgabe
                      out.sort();
                      
                      return out.join("\n");
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: ce37ba7922bb49668f6b2aff8c428ff4
              name: 'Hytale player UUID:{#UUID} magic charges state'
              type: DEPENDENT
              key: 'player.magiccharges["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
