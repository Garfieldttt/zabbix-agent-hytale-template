            - uuid: fbfeef9c24fb4e92b14a213be3d74242
              name: 'Hytale player UUID:{#UUID} stamina regen delay state'
              type: DEPENDENT
              key: 'player.staminaregendelay["{#PATHNAME}"]'
              delay: '0'
