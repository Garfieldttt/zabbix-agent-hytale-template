                  value: '{#UUID}'
            - uuid: fbc49e7ad0274e4c97bc18f714d1042d
              name: 'Hytale player UUID:{#UUID} signature energy state'
              type: DEPENDENT
              key: 'player.signatureenergy["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
