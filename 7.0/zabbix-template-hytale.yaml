              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: cfceba298d18478fab33d04fc0484fa3
              name: 'Hytale player UUID:{#UUID} stamina state'
              type: DEPENDENT
              key: 'player.stamina["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.Stamina.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
