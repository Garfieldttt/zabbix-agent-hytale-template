                  parameters:
                    - $.Components.EntityStats.Stats.MagicCharges.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: 8806904ecf19410f8bdeee0bf6c9f95f
              name: 'Hytale player UUID:{#UUID} name'
              type: DEPENDENT
              key: 'player.name["{#PATHNAME}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Nameplate.Text
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: 2a53da4752044d438e6245827de596ee
              name: 'Hytale player UUID:{#UUID} oxygen state'
              type: DEPENDENT
              key: 'player.oxygen["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.Oxygen.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: cd5abcaf6614494c9a5f3f52c38d6077
              name: 'Hytale player UUID:{#UUID} position'
              type: DEPENDENT
              key: 'player.position["{#PATHNAME}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Transform.Position
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var p;
                      
                      try {
                        p = JSON.parse(value);
                      } catch (e) {
                        return null;
                      }
                      
                      if (p == null || p.X == null || p.Y == null || p.Z == null) {
                        return null;
                      }
                      
                      return "X: " + p.X + ", Y: " + p.Y + ", Z: " + p.Z;
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: 40de8f281f5f45569b3b7d1539878f87
              name: 'Hytale player UUID:{#UUID} remaining duration'
              type: DEPENDENT
              key: 'player.remaining.duration["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.Components.EffectController.ActiveEntityEffects[0].RemainingDuration'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: bcb31fa6c71444948b6d6ce7786c8fc4
              name: 'Hytale player UUID:{#UUID} respawn points'
              type: DEPENDENT
              key: 'player.respawnpoints["{#PATHNAME}"]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.Player.PlayerData.PerWorldData
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var pwd, world, w, out, i, rp, bp, rsp, name;
                      
                      try {
                        pwd = JSON.parse(value);   // value ist das PerWorldData-Objekt
                      } catch (e) {
                        return null;
                      }
                      
                      if (!pwd) return "";
                      
                      out = [];
                      
                      for (world in pwd) {
                        if (!pwd.hasOwnProperty(world)) continue;
                      
                        w = pwd[world];
                        out.push("World: " + world);
                      
                        if (w.RespawnPoints && w.RespawnPoints.length) {
                          for (i = 0; i < w.RespawnPoints.length; i++) {
                            rp = w.RespawnPoints[i];
                      
                            name = rp.Name ? rp.Name : "Respawn point";
                            out.push(name);
                      
                            bp = rp.BlockPosition;
                            if (bp) {
                              out.push("  Block X: " + bp.X);
                              out.push("  Block Y: " + bp.Y);
                              out.push("  Block Z: " + bp.Z);
                            }
                      
                            rsp = rp.RespawnPosition;
                            if (rsp) {
                              out.push("  Respawn X: " + rsp.X);
                              out.push("  Respawn Y: " + rsp.Y);
                              out.push("  Respawn Z: " + rsp.Z);
                            }
                      
                            out.push(""); // Leerzeile zwischen Punkten
                          }
                        } else {
                          out.push("(no respawn points)");
                          out.push("");
                        }
                      }
                      
                      return out.join("\n");
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
                - tag: Hytale
                  value: '{#UUID}'
            - uuid: 69297a094cd043aa9f86adacd30c4178
              name: 'Hytale signature charges state'
              type: DEPENDENT
              key: 'player.signaturecharges["{#PATHNAME}"]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.Components.EntityStats.Stats.SignatureCharges.Value
              master_item:
                key: 'vfs.file.contents[{#PATHNAME},UTF-8]'
              tags:
