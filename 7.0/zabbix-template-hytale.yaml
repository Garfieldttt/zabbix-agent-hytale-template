                  value: '{#UUID}'
            - uuid: cc36990924574998b7ce32393a2562a2
              name: 'Hytale player UUID:{#UUID} world'
              type: DEPENDENT
              key: 'player.world["{#PATHNAME}"]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
